[project]
name = "mcp-bot"
version = "0.1.0"
description = "A bot for simplify the abstraction from technical manuals"
authors = [
    {name = "Samuel Jauregui",email = "samjaurz_@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
package-mode = false
dependencies = [
    "pdfplumber (>=0.11.7,<0.12.0)",
    "langchain (>=0.3.27,<0.4.0)",
    "sentence-transformers (>=5.1.0,<6.0.0)",
    "faiss-cpu (>=1.12.0,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "anthropic (>=0.68.0,<0.69.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "fastapi (>=0.117.1,<0.118.0)",
    "uvicorn[standard] (>=0.36.0,<0.37.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "fastmcp (>=2.12.4,<3.0.0)",
    "pgvector (>=0.4.1,<0.5.0)",
    "pymupdf (>=1.26.4,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
isort = "^6.0.1"
mypy = "^1.18.2"
ruff = "^0.13.2"
pytest = "^8.4.2"
black = "^25.9.0"

